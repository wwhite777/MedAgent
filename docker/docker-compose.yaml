version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  medllama:
    build:
      context: ../../ml/medllama
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8090:8090"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  medagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.medagent
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MEDLLAMA_API_URL=http://medllama:8090
    depends_on:
      - medllama
    env_file:
      - ../.env

volumes:
  qdrant_data:
